name: Flights Update

# 25.09.2026: cron-ът е махнат. Това е старият AviationStack скрейпър —
# грешките се поглъщат, затова рънът беше зелен, а данните стояха.
# "Sync to BAK" никога не е можел да мине (GITHUB_TOKEN няма право в BAK).
# BAK тегли полетите сам през mvr-proxy/AeroDataBox (BAK/flights.yml).
# Остава само ръчно пускане.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Sofia arrivals
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python3 .github/merge_flights.py

      - name: Sync to BAK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/sync_bak.py

      - name: Commit
        run: |
          git config user.name "FlightBot"
          git config user.email "bot@github.com"
          git add flight-cache.json
          git diff --cached --quiet || git commit -m "flights: $(date -u +%Y-%m-%dT%H:%M)"
          git push
